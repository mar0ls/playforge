<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Playforge</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .login-card { width: min(360px, 92vw); background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .login-card h1 { font-size: 1.2rem; margin: 0 0 1rem; display: flex; align-items: center; gap: .5rem; }
    .login-card input { width: 100%; box-sizing: border-box; margin: .5rem 0; }
    .login-card button { width: 100%; }
    .login-err { color: var(--fail, #f85149); font-size: .9rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <h1>✨ Playforge</h1>
    <p class="text-sm muted">This instance is password-protected.</p>
    <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
