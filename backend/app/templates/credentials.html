{% extends "base.html" %}
{% block title %}Credentials — Playforge{% endblock %}
{% block breadcrumb %}<span>Credentials</span>{% endblock %}
{% block header_actions %}
  <button class="btn" @click="$dispatch('open-cred-form')">
    <i class="icon" data-lucide="plus"></i> New credential
  </button>
{% endblock %}
{% block content %}
<section x-data="credsPage()" x-init="load()" @open-cred-form.window="showForm = true; resetForm()">

  <div class="card" x-show="showForm" x-cloak>
    <div class="card-header">
      <h3 x-text="editingId ? 'Edit credential' : 'New credential'"></h3>
      <button class="btn-ghost" @click="showForm = false"><i class="icon" data-lucide="x"></i></button>
    </div>
    <form @submit.prevent="save()">
      <div class="form-row">
        <label>Kind
          <select x-model="form.kind" :disabled="editingId">
            <option value="ssh_key">SSH key</option>
            <option value="vault_password">Vault password</option>
            <option value="become_password">Become / sudo password</option>
            <option value="wireguard_key">WireGuard config</option>
          </select>
        </label>
        <label>Name
          <input type="text" x-model="form.name" required placeholder="prod-deploy-key">
        </label>
      </div>
      <label>Description (optional)
        <input type="text" x-model="form.description" placeholder="What this credential is for">
      </label>
      <label>
        <span x-text="form.kind === 'ssh_key' ? 'Private key (paste contents of id_ed25519, etc.)' :
                       form.kind === 'wireguard_key' ? 'WireGuard config' :
                       'Secret value'"></span>
        <textarea x-model="form.secret" rows="8"
                  :required="!editingId"
                  :placeholder="editingId ? '(leave blank to keep existing)' :
                    (form.kind === 'ssh_key' ? '-----BEGIN OPENSSH PRIVATE KEY-----\n...' : '')"></textarea>
      </label>
      <label x-show="form.kind === 'ssh_key'">
        Public key (optional, helps you identify the credential later)
        <textarea x-model="form.public_part" rows="2" placeholder="ssh-ed25519 AAAA... user@host"></textarea>
      </label>
      <div class="row gap-sm">
        <button type="submit" :disabled="saving">
          <i class="icon" data-lucide="save"></i>
          <span x-text="saving ? 'Saving…' : (editingId ? 'Update' : 'Create')"></span>
        </button>
        <button type="button" class="btn-secondary" @click="showForm = false">Cancel</button>
      </div>
    </form>
  </div>

  <template x-if="creds.length === 0 && !showForm">
    <div class="empty-state">
      <i class="icon" data-lucide="key-round"></i>
      <p>No credentials yet. Add an SSH key, vault password, etc. that you'll reuse across projects.</p>
    </div>
  </template>

  <template x-for="c in creds" :key="c.id">
    <div class="card">
      <div class="row between">
        <div>
          <div class="row gap-sm">
            <span class="badge muted" x-text="kindLabel(c.kind)"></span>
            <strong x-text="c.name"></strong>
            <span class="badge" :class="c.has_secret ? 'ok' : 'fail'"
                  x-text="c.has_secret ? 'has secret' : 'no secret file'"></span>
          </div>
          <div class="text-sm muted" x-show="c.description" x-text="c.description"></div>
          <div class="text-xs muted font-mono" x-show="c.public_part" x-text="c.public_part.slice(0, 80) + (c.public_part.length > 80 ? '…' : '')"></div>
          <div class="text-xs muted">Created <span x-text="new Date(c.created_at).toLocaleString()"></span></div>
        </div>
        <div class="row gap-sm">
          <button class="btn-secondary btn-sm" @click="edit(c)"><i class="icon" data-lucide="pencil"></i></button>
          <button class="btn-secondary btn-sm danger" @click="remove(c.id)"><i class="icon" data-lucide="trash-2"></i></button>
        </div>
      </div>
    </div>
  </template>

</section>

<script>
function credsPage() {
  return {
    creds: [], showForm: false, saving: false, editingId: null,
    form: { kind: "ssh_key", name: "", description: "", secret: "", public_part: "" },

    resetForm() {
      this.editingId = null;
      this.form = { kind: "ssh_key", name: "", description: "", secret: "", public_part: "" };
    },
    kindLabel(k) {
      return { ssh_key: "SSH", vault_password: "Vault", become_password: "Become", wireguard_key: "WireGuard" }[k] || k;
    },
    async load() {
      const r = await fetch("/api/credentials");
      this.creds = await r.json();
      this.$nextTick(() => lucide.createIcons());
    },
    edit(c) {
      this.editingId = c.id;
      this.form = { kind: c.kind, name: c.name, description: c.description, secret: "", public_part: c.public_part };
      this.showForm = true;
    },
    async save() {
      this.saving = true;
      try {
        const url = this.editingId ? `/api/credentials/${this.editingId}` : "/api/credentials";
        const method = this.editingId ? "PATCH" : "POST";
        const body = this.editingId
          ? { name: this.form.name, description: this.form.description,
              public_part: this.form.public_part,
              ...(this.form.secret ? {secret: this.form.secret} : {}) }
          : this.form;
        const r = await fetch(url, {
          method, headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
        });
        if (!r.ok) { alert(await r.text()); return; }
        this.showForm = false; this.resetForm();
        await this.load();
      } finally { this.saving = false; }
    },
    async remove(id) {
      if (!confirm("Delete this credential? The secret file will also be removed.")) return;
      await fetch(`/api/credentials/${id}`, {method: "DELETE"});
      await this.load();
    },
  };
}
</script>
{% endblock %}
