{% extends "base.html" %}
{% block title %}Assistant — Playforge{% endblock %}
{% block breadcrumb %}<span>Assistant</span>{% endblock %}
{% block content %}
<style>
  .chat { display: flex; flex-direction: column; gap: 0.75rem; }
  .chat-log { max-height: 64vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.25rem; }
  .msg { max-width: 80%; padding: 0.6rem 0.8rem; border-radius: 10px; }
  .msg .msg-role { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; margin-bottom: 0.25rem; }
  .msg.user { align-self: flex-end; background: rgba(47,129,247,0.12); border: 1px solid rgba(47,129,247,0.3); }
  .msg.assistant { align-self: flex-start; background: var(--bg-elev-2, #161b22); border: 1px solid var(--border, #30363d); }
  .msg-text { white-space: pre-wrap; line-height: 1.45; }
  .chat-input { display: flex; gap: 0.5rem; align-items: flex-end; }
  .chat-input textarea { flex: 1; resize: vertical; }
</style>

<!-- The full assistant page shares ONE conversation with the slide-out dock via the
     global Alpine `chat` store (defined in base.html): same messages, same agent
     controls, persisted across refreshes. This page is just the roomy view of it. -->
<section x-data x-init="$store.chat.init()">
  <div class="card">
    <div class="card-header">
      <h3>✨ Assistant</h3>
      <span class="text-xs muted" x-show="$store.chat.model">via <span x-text="$store.chat.provider"></span> · <span class="font-mono" x-text="$store.chat.model"></span></span>
    </div>

    <template x-if="$store.chat.aiEnabled === false">
      <div class="empty-state">
        <i class="icon" data-lucide="sparkles"></i>
        <p>AI is not configured yet.</p>
        <a href="/settings" class="btn">Configure in Settings</a>
      </div>
    </template>

    <template x-if="$store.chat.aiEnabled !== false">
      <div class="chat">
        <div class="row gap-md" style="align-items:center; flex-wrap:wrap; margin-bottom:.5rem;">
          <div class="view-toggle">
            <button :class="{active: $store.chat.mode==='chat'}" @click="$store.chat.mode='chat'; $store.chat.persist()">💬 Chat</button>
            <button :class="{active: $store.chat.mode==='agent'}" @click="$store.chat.mode='agent'; $store.chat.persist()">🤖 Agent</button>
          </div>
          <template x-if="$store.chat.mode==='agent'">
            <div class="row gap-md" style="align-items:center; flex-wrap:wrap;">
              <label class="row gap-xs" style="align-items:center;">project
                <select x-model="$store.chat.agentProject" @change="$store.chat.persist()">
                  <option value="">— pick —</option>
                  <template x-for="p in $store.chat.projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                </select>
              </label>
              <label class="row gap-xs" style="align-items:center;" title="Let the agent create/edit/move files and add collections">
                <input type="checkbox" x-model="$store.chat.allowMutate" @change="$store.chat.persist()"> allow changes
              </label>
              <label class="row gap-xs" style="align-items:center;" title="Let it delete files and fetch docs from the web">
                <input type="checkbox" x-model="$store.chat.allowConfirm" @change="$store.chat.persist()"> allow delete / web
              </label>
            </div>
          </template>
        </div>
        <p class="text-xs muted" x-show="$store.chat.mode==='agent'" style="margin:-.25rem 0 .5rem;">
          The agent inspects and (if allowed) changes the project through tools — every change is a separate git commit you can revert.
        </p>
        <div class="chat-log">
          <template x-if="$store.chat.messages.length === 0">
            <div class="empty-state">
              <i class="icon" data-lucide="sparkles"></i>
              <h2 style="margin:0.5rem 0;">Tell me what you want to do</h2>
              <p class="muted">Generate a playbook, fix an error, or ask anything about Ansible.</p>
              <div class="row wrap gap-sm mt-2" style="justify-content:center;">
                <template x-for="ex in $store.chat.examples" :key="ex">
                  <button class="btn-secondary btn-sm" @click="$store.chat.input = ex; $store.chat.submit()" x-text="ex"></button>
                </template>
              </div>
            </div>
          </template>

          <template x-for="(m, i) in $store.chat.messages" :key="i">
            <div :class="`msg ${m.role}`">
              <div class="msg-role" x-text="m.role === 'user' ? 'You' : (m.agent ? 'Agent' : 'Assistant')"></div>
              <div class="muted" x-show="m.streaming && !m.content">thinking…</div>
              <template x-if="m.steps && m.steps.length">
                <div class="text-xs" style="margin-bottom:.4rem;">
                  <div style="font-weight:600;">🤖 Actions (<span x-text="m.steps.length"></span>):</div>
                  <template x-for="(st, si) in m.steps" :key="si">
                    <div style="border-left:2px solid var(--border,#30363d); padding:.15rem .5rem; margin:.2rem 0;">
                      <code x-text="st.tool"></code>
                      <span class="muted" x-text="st.args && Object.keys(st.args).length ? ' ' + JSON.stringify(st.args).slice(0,80) : ''"></span>
                      <span x-show="st.observation && st.observation.error" style="color:var(--fail);" x-text="' → ' + (st.observation && st.observation.error)"></span>
                      <span x-show="st.observation && (st.observation.saved || st.observation.to || st.observation.created || st.observation.deleted)" style="color:var(--ok,#3fb950);"> ✓</span>
                    </div>
                  </template>
                  <div x-show="m.stoppedReason" class="muted" x-text="'stopped: ' + m.stoppedReason"></div>
                </div>
              </template>
              <template x-if="m.warnings && m.warnings.length">
                <div class="text-xs mt-1" style="border:1px solid var(--warn,#d29922); border-radius:6px; padding:.4rem .6rem;">
                  <strong style="color:var(--warn,#d29922);">🛡️ Safety check (validated automatically):</strong>
                  <ul style="padding-left:1.25rem; margin:.25rem 0;">
                    <template x-for="w in m.warnings" :key="w"><li x-text="w"></li></template>
                  </ul>
                </div>
              </template>
              <template x-if="m.needed && m.needed.length && m.goal">
                <div class="row gap-sm" style="margin:.4rem 0; align-items:center;">
                  <button class="btn btn-sm" @click="$store.chat.enableAndRetry(m)">
                    <i class="icon" data-lucide="unlock"></i>
                    <span x-text="m.needed.includes('confirm') ? 'Enable delete/web & retry' : 'Enable changes & retry'"></span>
                  </button>
                  <span class="text-xs muted">The agent needed a permission that was off.</span>
                </div>
              </template>
              <template x-for="(seg, j) in $store.chat.segments(m.content)" :key="j">
                <div>
                  <template x-if="seg.type === 'code'">
                    <div>
                      <pre class="log" style="margin:0.4rem 0;" x-text="seg.text"></pre>
                      <div class="row gap-sm" style="margin:-0.2rem 0 0.4rem;">
                        <button class="btn-ghost btn-sm" @click="$store.chat.copy(seg.text)"><i class="icon" data-lucide="copy"></i> Copy</button>
                        <button class="btn-ghost btn-sm" @click="$store.chat.openSave(seg.text)"><i class="icon" data-lucide="save"></i> Save to project…</button>
                      </div>
                    </div>
                  </template>
                  <div x-show="seg.type === 'text'" class="msg-text md-body" x-html="renderMarkdown(seg.text)"></div>
                </div>
              </template>

              <template x-if="m.files && m.files.length">
                <div class="mt-1" style="border-top:1px solid var(--border,#30363d); padding-top:0.4rem;">
                  <div class="row between" style="align-items:center;">
                    <strong class="text-sm">📁 Files (<span x-text="m.files.length"></span>)</strong>
                    <button class="btn-sm" @click="$store.chat.saveAllFiles(m.files)" :disabled="!$store.chat.projects.length">
                      <i class="icon" data-lucide="save"></i> Save all to project
                    </button>
                  </div>
                  <template x-for="(f, fi) in m.files" :key="fi">
                    <div class="card" style="background: var(--bg-elev-2,#161b22); margin:0.4rem 0; padding:0.5rem;">
                      <div class="row between" style="align-items:center;">
                        <code class="text-sm" x-text="f.path"></code>
                        <div class="row gap-sm">
                          <button class="btn-ghost btn-sm" @click="$store.chat.copy(f.content)">Copy</button>
                          <button class="btn-ghost btn-sm" @click="$store.chat.openSave(f.content, f.path)">Save…</button>
                        </div>
                      </div>
                      <pre class="log" style="margin:0.3rem 0 0; max-height:14rem;" x-text="f.content"></pre>
                    </div>
                  </template>
                  <span class="text-xs" :class="$store.chat.saveMsgClass" x-text="$store.chat.saveMsg"></span>
                </div>
              </template>

              <template x-if="m.invalid_modules && m.invalid_modules.length">
                <div class="text-xs mt-1" style="color: var(--fail);">
                  ⚠️ Self-check: these modules don't exist — <code x-text="m.invalid_modules.join(', ')"></code>
                </div>
              </template>
              <template x-if="m.uninstalled_modules && m.uninstalled_modules.length">
                <div class="text-xs mt-1" style="color: var(--accent, #58a6ff);">
                  ℹ️ Real modules, but their collection isn't installed here — <code x-text="m.uninstalled_modules.join(', ')"></code>.
                  Add it via the project's <strong>Dependencies (Galaxy)</strong> card or <code>requirements.yml</code>.
                </div>
              </template>
              <template x-if="m.playbook_issues && m.playbook_issues.length">
                <div class="text-xs mt-1" style="border-top:1px solid var(--border,#30363d); padding-top:0.4rem;">
                  <div style="font-weight:600;">🛡️ Rule check (the AI's playbook was verified):</div>
                  <ul style="padding-left:1.25rem; margin:0.25rem 0;">
                    <template x-for="iss in m.playbook_issues" :key="iss.message">
                      <li :style="iss.severity === 'error' ? 'color:var(--fail)' : 'color:var(--warn)'">
                        <strong x-text="iss.severity === 'error' ? 'error: ' : 'warn: '"></strong><span x-text="iss.message"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </template>

          <div class="msg assistant" x-show="$store.chat.busy && !$store.chat.messages.some(x => x.streaming)">
            <div class="msg-role" x-text="$store.chat.mode==='agent' ? 'Agent' : 'Assistant'"></div>
            <div class="muted" x-text="$store.chat.mode==='agent' ? 'working…' : 'thinking…'"></div>
          </div>
        </div>

        <div class="card" x-show="$store.chat.saveDialog" x-cloak style="border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.05);">
          <h4>Save snippet to a project</h4>
          <template x-if="$store.chat.projects.length === 0">
            <p class="text-sm muted">No projects yet — create one first, then come back.</p>
          </template>
          <div class="form-row" x-show="$store.chat.projects.length">
            <label>Project
              <select x-model="$store.chat.saveDialog.project">
                <template x-for="p in $store.chat.projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
              </select>
            </label>
            <label>Path
              <input type="text" x-model="$store.chat.saveDialog.path" placeholder="playbooks/from-assistant.yml">
            </label>
          </div>
          <div class="row gap-sm mt-1">
            <button @click="$store.chat.saveSnippet()" :disabled="$store.chat.saving || !$store.chat.saveDialog.project || !$store.chat.saveDialog.path"
                    x-show="$store.chat.projects.length">
              <span x-text="$store.chat.saving ? 'Saving…' : 'Save'"></span>
            </button>
            <button class="btn-secondary" @click="$store.chat.saveDialog = null">Cancel</button>
            <span class="text-sm" :class="$store.chat.saveMsgClass" x-text="$store.chat.saveMsg"></span>
          </div>
        </div>

        <form class="chat-input" @submit.prevent="$store.chat.submit()">
          <textarea x-model="$store.chat.input" rows="2"
                    :placeholder="$store.chat.mode==='agent' ? 'Tell the agent what to do on the project…' : 'Describe what you want to do…  (Enter to send, Shift+Enter for a new line)'"
                    @input.debounce.600ms="$store.chat.persist()"
                    @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); $store.chat.submit(); }"></textarea>
          <button type="submit" :disabled="$store.chat.busy || !$store.chat.input.trim()">
            <i class="icon" data-lucide="send"></i>
          </button>
        </form>
        <div class="row gap-sm">
          <button class="btn-ghost btn-sm" @click="$store.chat.clear()" x-show="$store.chat.messages.length">Clear chat</button>
        </div>
      </div>
    </template>
  </div>
</section>
{% endblock %}
