[mypy]
# Pragmatic baseline: type-check our own code, but don't drown in third-party stubs
# (ansible-runner, git, anthropic, etc. ship few/none). Tighten over time.
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
# We don't annotate every local helper yet; checking untyped bodies adds noise
# without catching much. Signatures and assignments are still checked.
check_untyped_defs = False
exclude = (^|/)tests/
