name: Password auth disabled with no SSH key installed first
why: >
  Ordering constraint. Disabling PasswordAuthentication before any authorized_key
  task means the next connection has no usable auth method. Classic hardening
  playbook mistake that models reproduce happily.
content: |
  ---
  - hosts: all
    become: true
    tasks:
      - name: Harden sshd
        ansible.builtin.lineinfile:
          path: /etc/ssh/sshd_config
          regexp: '^PasswordAuthentication'
          line: 'PasswordAuthentication no'
      - name: Restart sshd
        ansible.builtin.service:
          name: sshd
          state: restarted
expect_rules: [ssh-lockout-password-auth]
