name: Release

# Publishes the multi-arch image to Docker Hub on a `v*` tag.
#
# To release: bump `__version__`, add the CHANGELOG section, tag, push.
#
# Notes:
#   arm64 is built because contributors run it; amd64-only would emulate.
#   Tag/version/CHANGELOG agreement is checked here, not in CI — CI runs inside
#   the image, which has no CHANGELOG.md.
#   Tags are computed in shell rather than docker/metadata-action: that action
#   reads github.ref, which on workflow_dispatch is the branch, not the tag.
#
# Secret: DOCKERHUB_TOKEN (access token with Read/Write, not the password).
# The username is in `env` — it is public in the image name, so a secret would
# protect nothing.

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to (re)publish"
        required: true

env:
  IMAGE: docker.io/mar0ls/playforge
  DOCKERHUB_USER: mar0ls

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the GitHub Release

    steps:
      # First step on purpose: this is the only job holding DOCKERHUB_TOKEN and
      # contents:write, and the only one whose output users pull. The sensor
      # observes the runner, not the buildkit containers the image is built in,
      # so coverage here is partial — the steps that resolve dependencies and
      # handle the token are what it watches.
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Fail before anything reaches Docker Hub.
      - name: Resolve version and image tags
        id: v
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RAW_TAG" in
            v*) ;;
            *) echo "::error::expected a v-prefixed tag, got '$RAW_TAG'"; exit 1 ;;
          esac
          version="${RAW_TAG#v}"
          # v0.9.0-rc1 is a candidate for 0.9.0: the suffix is on the tag, not in
          # the source, so check __version__ and the CHANGELOG against the base.
          base="${version%%-*}"

          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/__init__.py)"
          if [ "$base" != "$code" ]; then
            echo "::error::tag $RAW_TAG targets $base but __version__ is '$code' in backend/app/__init__.py"
            exit 1
          fi
          if ! grep -q "\[$base\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$base] section"
            exit 1
          fi

          # A prerelease publishes its own tag only — never `latest` or major.minor.
          # Braces matter: in zsh `$IMAGE:latest` is the `:l` modifier plus "atest",
          # which publishes `playforgeatest` without erroring. Actions runs bash.
          tags="${IMAGE}:${version}"
          case "$version" in
            *-*) echo "prerelease — publishing ${version} only" ;;
            *)   tags="${tags},${IMAGE}:${version%.*},${IMAGE}:latest" ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Playforge
            org.opencontainers.image.description=Self-hosted web UI for managing and running Ansible, with a self-checking AI layer
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/mar0ls/playforge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the pushed image back and check it boots, reports the right version,
      # and has run its migrations.
      - name: Smoke-test the published image
        env:
          VERSION: ${{ steps.v.outputs.version }}
          # __version__ carries no prerelease suffix, so compare the base.
          EXPECT_VERSION: ${{ steps.v.outputs.base }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8765:8765 -e ANSIBLE_GUI_DATA_DIR=/data "${IMAGE}:${VERSION}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health -o /tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done
          if [ ! -s /tmp/health.json ]; then
            echo "::error::/health never answered"; docker logs smoke; exit 1
          fi
          cat /tmp/health.json
          python3 - <<'PY'
          import json, os, sys
          h = json.load(open("/tmp/health.json"))
          want = os.environ["EXPECT_VERSION"]
          if h.get("version") != want:
              sys.exit(f"::error::/health reports version {h.get('version')!r}, expected {want!r}")
          if h.get("status") != "ok":
              sys.exit(f"::error::/health status is {h.get('status')!r}")
          if not isinstance(h.get("schema_version"), int):
              sys.exit(f"::error::/health schema_version is {h.get('schema_version')!r}")
          print("smoke ok:", h)
          PY
          docker rm -f smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Or GitHub shows a release candidate as the current release.
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ```bash
            docker pull ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ```

            See [CHANGELOG.md](https://github.com/mar0ls/playforge/blob/main/CHANGELOG.md) for what changed.
