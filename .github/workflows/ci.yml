name: CI

# Runs the full test suite the same way `make test` does locally: inside the
# built image, so heavy tests (git, ansible-doc, baked Galaxy collections) really
# run instead of being skipped. The same file works under Gitea/Forgejo Actions —
# it's the same runner engine and action set.
#
# Quoted so YAML 1.1 doesn't read `on` as the boolean true.
"on":
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t playforge:dev ./backend

      # --cov-fail-under is the floor, not the goal: it exists so coverage can't
      # drift down unnoticed between releases. Raise it when the real number
      # rises; never lower it to make a build green. It sits just under the
      # actual total (82.35%) rather than at it — coverage.py compares
      # the unrounded figure, so a floor equal to the rounded number fails.
      - name: Run test suite in image
        run: |
          mkdir -p coverage
          sudo chown 1000:1000 coverage
          docker run --rm \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/pytest.ini:/app/pytest.ini:ro" \
            -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            -v "$PWD/coverage:/workspace" \
            playforge:dev \
            sh -c "pip install -q -U -r requirements-dev.txt && python -m pytest --cov=app --cov-report=xml:/workspace/coverage.xml --cov-fail-under=82 -p no:cacheprovider --color=yes"

      - name: Verify coverage report
        run: ls -lh coverage/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml

  # Fast syntax check, independent of Docker build.
  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all backend modules
        run: python -m compileall -q backend/app

  # Static type check.
  types:
    runs-on: ubuntu-latest

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + runtime deps
        run: pip install -q "mypy>=1.8" -r backend/requirements.txt

      - name: Type-check backend/app
        working-directory: backend
        run: python -m mypy app --config-file mypy.ini