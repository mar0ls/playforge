# Version updates for GitHub Actions; security updates only for pip.
#
# release.yml pins every action by commit SHA, which is the right way to depend on
# one and also means none of them can move at all. ci.yml pins three by tag
# (checkout, setup-python, codecov), which float within a major version but never
# cross one. Neither kind crosses a major on its own, and that is what the v1.0.0
# release ran into: six actions still targeting the Node 20 runtime, nothing
# broken until the runner stops supporting it. Dependabot rewrites the SHA and
# the version comment together, which is the tedious part to do by hand.
#
# pip gets no scheduled bumps. The image installs from `backend/requirements-lock.txt`
# with `--require-hashes`, regenerated deliberately through `make lock`, and a
# monthly bot rewrite of a hash-pinned file is more likely to produce a broken
# build than a useful one. The pip entry exists anyway, with its PR limit at 0,
# because security updates still open PRs and Dependabot refuses to rebase a PR
# whose ecosystem has no entry here. That is how #23 (GitPython, 14 alerts)
# ended up bumped by hand.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Monthly, not weekly: action releases are rarely urgent, and a PR nobody
      # reads is worse than no PR. Security fixes arrive through alerts anyway.
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all of them. Six separate SHA bumps to review individually is
      # how a solo maintainer starts ignoring the bot.
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    # 0 turns off version updates only; security updates ignore this limit.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
